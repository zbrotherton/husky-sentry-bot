
ekf_node_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2

    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Raw Husky wheel odometry
    odom0: /platform/odom
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ZED visual-inertial odometry
    odom1: /zed/zed_node/odom
    odom1_config: [
      true,  true,  false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom1_differential: false
    odom1_relative: true
    odom1_queue_size: 10
