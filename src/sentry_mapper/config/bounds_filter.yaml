scan_to_scan_filter_chain:
  ros__parameters:
    filter1: #left_standoff_filter:
      name: left_standoff_filter
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        #laser_frame: laser_frame 
        #sector to remove (rads)
        lower_angle: 0.750
        upper_angle: 0.820

    filter2: #right_standoff_filter:
      name: right_standoff_filter
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        #laser_frame: laser_frame
        # sector to remove (rads)
        lower_angle: -0.820
        upper_angle: -0.750
